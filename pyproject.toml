[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axicavity-fem"
version = "3.0.0"
description = "2-D axisymmetric finite-element solver for RF cavity resonant modes (TM0 and higher-order modes), with a parametric sketch-based GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Takuya Natsui" },
]
keywords = [
    "finite-element-method", "electromagnetics", "accelerator-physics",
    "rf-cavity", "eigenmode", "gmsh",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "gmsh>=4.11,<5",
    "Pillow>=10",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "planegcs>=0.8"]
viz3d = ["pyvista>=0.44", "pyvistaqt>=0.11"]
dev = ["pytest>=7", "pytest-cov", "pytest-qt>=4.2"]
accel = ["pypardiso>=0.4"]

[project.urls]
Homepage = "https://github.com/TakuyaNatsui/AxiCavity-FEM"
Documentation = "https://github.com/TakuyaNatsui/AxiCavity-FEM/blob/main/USER_MANUAL.md"
Issues = "https://github.com/TakuyaNatsui/AxiCavity-FEM/issues"

[project.scripts]
axicavity-fem = "axicavity_fem.cli.main:cli_main"
axicavity-fem-run = "axicavity_fem.gui.batch:main"

[project.gui-scripts]
axicavity-fem-gui = "axicavity_fem.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"axicavity_fem.gui" = ["ui/icons/*.svg", "ui/app_icon.svg", "i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
